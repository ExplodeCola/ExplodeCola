name: Generate Combo Meter

on:
  schedule:
    # 每 12 小时刷新一次
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2e88&color_dots=#0b0f1e,#1e2a4a,#8b5cf6,#00e5ff,#ffd93d
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2e88&color_dots=#05070f,#1e2a4a,#8b5cf6,#00e5ff,#ffd93d

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
